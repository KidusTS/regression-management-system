spring.application.name=regression-management-backend

# =====================================================
# Database
# =====================================================
# No secrets or defaults here: these MUST come from the environment (or the `dev` profile locally).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# Flyway
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================
# JWT
# =====================================================
# Required, >= 32 bytes. Generate one with: openssl rand -hex 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# =====================================================
# CORS / bootstrap
# =====================================================
# Comma-separated list of browser origins allowed to call the API
app.cors.allowed-origins=${ALLOWED_ORIGIN:http://localhost:3000}
# Optional: the user who registers with this email becomes ADMIN
app.admin-email=${ADMIN_EMAIL:}

# =====================================================
# File Upload
# =====================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =====================================================
# Server
# =====================================================
server.port=8080
