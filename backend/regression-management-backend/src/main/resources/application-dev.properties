# =====================================================
# Local development profile (activated automatically by `./gradlew bootRun`).
# Everything here can be overridden by environment variables. NEVER used in production
# because the production jar runs without this profile and then requires real env vars.
# =====================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/regression_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# DEV ONLY signing key (public in git, so tokens signed with it are worthless in prod)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
